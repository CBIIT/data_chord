name: Set up DataChord Python project
description: Install the locked Python environment, including the private agentic dependency

inputs:
  app-id:
    description: GitHub App client ID allowed to read agentic_harmonization
    required: true
  private-key:
    description: GitHub App private key allowed to read agentic_harmonization
    required: true

runs:
  using: composite
  steps:
    - name: Create agentic dependency token
      id: agentic-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: agentic_harmonization

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        # Security: pin uv so dependency age enforcement stays stable in CI.
        version: "0.13.4"
        enable-cache: true

    - name: Set up Python
      shell: bash
      run: uv python install

    - name: Install locked Python dependencies
      shell: bash
      # Security: CI must use the committed lockfile, not silently resolve fresh packages.
      run: uv sync --frozen --all-extras
      env:
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.agentic-token.outputs.token }}@github.com/.insteadOf
        GIT_CONFIG_VALUE_0: https://github.com/
