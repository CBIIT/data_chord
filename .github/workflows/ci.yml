name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.10.3

      - name: Check OpenTofu format
        run: tofu -chdir=infra fmt -check -recursive

      - name: Initialize OpenTofu without a backend
        run: |
          tofu -chdir=infra init -backend=false -input=false
          tofu -chdir=infra/cloud-one init -backend=false -input=false
          tofu -chdir=infra/customer-platform init -backend=false -input=false
          tofu -chdir=infra/modules/data-plane init -backend=false -input=false

      - name: Validate OpenTofu
        run: |
          tofu -chdir=infra validate
          tofu -chdir=infra/cloud-one validate
          tofu -chdir=infra/customer-platform validate
          tofu -chdir=infra/modules/data-plane validate

      - name: Test OpenTofu behavior
        run: |
          tofu -chdir=infra test
          tofu -chdir=infra/cloud-one test
          tofu -chdir=infra/customer-platform test
          tofu -chdir=infra/modules/data-plane test

      - name: Test deployment flow
        run: bash infra/tests/deployment_flow_test.sh

      - name: Check shell syntax
        run: bash scripts/check-shell-syntax.sh

  quality:
    name: Code quality and security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node project
        uses: ./.github/actions/setup-node-project

      # Fork pull requests cannot receive the private agentic source credential.
      - name: Set up Python project
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/setup-python-project
        with:
          app-id: ${{ vars.DATA_CHORD_BUILD_APP_ID }}
          private-key: ${{ secrets.DATA_CHORD_BUILD_APP_PRIVATE_KEY }}

      - name: Check JavaScript syntax
        run: bash scripts/check-js-syntax.sh

      - name: Run JavaScript tests
        run: npm test

      - name: Run JavaScript and TypeScript type check
        run: npm run typecheck

      - name: Run Python type check
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: uv run basedpyright --level error src/

      - name: Run repository pre-commit hooks
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Run vulture
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: uv run vulture

      - name: Run bandit
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: uv run bandit -r src/ -c pyproject.toml

      - name: Run dependency audit
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: >-
          uv run pip-audit
          --ignore-vuln CVE-2026-69247

  test:
    # Fork pull requests cannot receive the private agentic source credential.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python project
        uses: ./.github/actions/setup-python-project
        with:
          app-id: ${{ vars.DATA_CHORD_BUILD_APP_ID }}
          private-key: ${{ secrets.DATA_CHORD_BUILD_APP_PRIVATE_KEY }}

      - name: Run tests
        run: uv run pytest --tb=short

  container:
    # Pull requests prove that the production image can build and start. A
    # successful main run publishes the same commit through publish-image.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create agentic dependency token
        id: agentic-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DATA_CHORD_BUILD_APP_ID }}
          private-key: ${{ secrets.DATA_CHORD_BUILD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: agentic_harmonization

      - name: Build the production container
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --provenance=false \
            --secret id=github_token,env=PRIVATE_DEPENDENCY_TOKEN \
            --tag data-chord:ci .
        env:
          PRIVATE_DEPENDENCY_TOKEN: ${{ steps.agentic-token.outputs.token }}

      - name: Smoke-test the production container
        run: |
          docker run --rm \
            --entrypoint python \
            --env DEV_MODE=true \
            --env DATA_CHORD_REFERENCE_TABLE=reference \
            --env DATA_CHORD_HARMONIZATION_CACHE_TABLE=harmonization-cache \
            --env DATA_CHORD_CDE_RECOMMENDATION_CACHE_TABLE=cde-recommendation-cache \
            data-chord:ci \
            -c "import backend.app.main, numpy, pandas, pyarrow; print('container smoke test passed')"

  # E2E tests using Playwright with Chromium for browser automation.
  e2e:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # Pin the runner because Playwright 1.58.1 does not provide Chromium
    # support for Ubuntu 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python project
        uses: ./.github/actions/setup-python-project
        with:
          app-id: ${{ vars.DATA_CHORD_BUILD_APP_ID }}
          private-key: ${{ secrets.DATA_CHORD_BUILD_APP_PRIVATE_KEY }}

      - name: Set up Node project
        uses: ./.github/actions/setup-node-project

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: ./node_modules/.bin/playwright install chromium --with-deps

      - name: Install Playwright deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: ./node_modules/.bin/playwright install-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

  required:
    name: Required CI gate
    if: ${{ always() }}
    needs:
      - infrastructure
      - quality
      - test
      - e2e
      - container
    runs-on: ubuntu-24.04
    steps:
      - name: Require the checks appropriate for this source
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          INFRASTRUCTURE_RESULT: ${{ needs.infrastructure.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          require_result() {
            if [ "$2" != "$3" ]; then
              echo "::error::$1 result was '$2'; expected '$3'"
              return 1
            fi
          }

          require_result infrastructure "${INFRASTRUCTURE_RESULT}" success
          require_result quality "${QUALITY_RESULT}" success

          if [ "${EVENT_NAME}" = "pull_request" ] && [ "${HEAD_REPOSITORY}" != "${REPOSITORY}" ]; then
            require_result test "${TEST_RESULT}" skipped
            require_result e2e "${E2E_RESULT}" skipped
            require_result container "${CONTAINER_RESULT}" skipped
          else
            require_result test "${TEST_RESULT}" success
            require_result e2e "${E2E_RESULT}" success
            if [ "${EVENT_NAME}" = "pull_request" ]; then
              require_result container "${CONTAINER_RESULT}" success
            else
              require_result container "${CONTAINER_RESULT}" skipped
            fi
          fi

  publish-image:
    name: Publish reviewed main image
    # The status function prevents an intentionally skipped sibling (the
    # PR-only container job) from suppressing this workflow while still
    # honoring operator cancellation.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.required.result == 'success' }}
    needs: required
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-image.yml
    with:
      image_source_sha: ${{ github.sha }}
    secrets: inherit
