name: Plan and deploy DataChord to Cloud One

run-name: DataChord ${{ inputs.operation }} (cbiit/dev)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Create a read-only plan or deploy that exact plan through dev approval
        required: true
        default: plan
        type: choice
        options:
          - plan
          - deploy
      image_source_sha:
        description: Optional full main-history commit SHA to deploy or roll back to (blank uses current main)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: data-chord-cbiit-dev
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate dev release request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      account_id: ${{ steps.environment.outputs.account_id }}
      deployer_role_arn: ${{ steps.environment.outputs.deployer_role_arn }}
      region: ${{ steps.environment.outputs.region }}
      state_bucket: ${{ steps.environment.outputs.state_bucket }}
      state_key: ${{ steps.environment.outputs.state_key }}
      image_source_sha: ${{ steps.source.outputs.image_source_sha }}
      infrastructure_source_sha: ${{ steps.source.outputs.infrastructure_source_sha }}
    steps:
      - name: Require main for every privileged run
        env:
          REQUESTED_REF: ${{ github.ref }}
        run: |
          test "${REQUESTED_REF}" = "refs/heads/main" || {
            echo "Cloud One releases must run from main." >&2
            exit 1
          }

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve reviewed application source
        id: source
        env:
          REQUESTED_IMAGE_SOURCE_SHA: ${{ inputs.image_source_sha }}
        run: |
          set -euo pipefail
          infrastructure_source_sha="$(git rev-parse HEAD)"
          test "${infrastructure_source_sha}" = "${GITHUB_SHA}"
          image_source_sha="$(python3 infra/scripts/resolve_release_source.py \
            --repository . \
            --current "${infrastructure_source_sha}" \
            --requested "${REQUESTED_IMAGE_SOURCE_SHA}")"
          {
            echo "image_source_sha=${image_source_sha}"
            echo "infrastructure_source_sha=${infrastructure_source_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Read the committed environment contract
        id: environment
        run: |
          config="environments/cbiit/dev.json"
          python3 infra/scripts/cloud_one_environment.py validate "${config}" cbiit dev
          {
            echo "account_id=$(python3 infra/scripts/cloud_one_environment.py get "${config}" cbiit dev account_id)"
            echo "deployer_role_arn=arn:aws:iam::$(python3 infra/scripts/cloud_one_environment.py get "${config}" cbiit dev account_id):role/foundation/cbiit-datachord-deployer"
            echo "region=$(python3 infra/scripts/cloud_one_environment.py get "${config}" cbiit dev region)"
            echo "state_bucket=$(python3 infra/scripts/cloud_one_environment.py get "${config}" cbiit dev state_bucket_name)"
            echo "state_key=$(python3 infra/scripts/cloud_one_environment.py get "${config}" cbiit dev state_key)"
          } >> "${GITHUB_OUTPUT}"

  plan:
    name: Plan cbiit/dev runtime
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_id: ${{ steps.upload-plan.outputs.artifact-id }}
      image_digest: ${{ steps.image.outputs.image_digest }}
      image_uri: ${{ steps.image.outputs.image_uri }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.10.3

      - name: Authenticate with read-only AWS permissions
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ needs.preflight.outputs.deployer_role_arn }}
          role-session-name: data-chord-dev-plan-${{ github.run_id }}
          aws-region: ${{ needs.preflight.outputs.region }}
          allowed-account-ids: ${{ needs.preflight.outputs.account_id }}
          managed-session-policies: arn:aws:iam::aws:policy/ReadOnlyAccess

      - name: Resolve the published and scanned application image
        id: image
        env:
          ACCOUNT_ID: ${{ needs.preflight.outputs.account_id }}
          AWS_REGION: ${{ needs.preflight.outputs.region }}
          IMAGE_SOURCE_SHA: ${{ needs.preflight.outputs.image_source_sha }}
        run: |
          set -euo pipefail
          repository="data-chord-dev"
          image_uri="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${repository}"
          if ! aws ecr describe-images \
            --repository-name "${repository}" \
            --image-ids "imageTag=${IMAGE_SOURCE_SHA}" \
            --output json > /tmp/data-chord-image.json; then
            echo "::error::No published image exists for ${IMAGE_SOURCE_SHA}. Run the Publish or restore DataChord image workflow first."
            exit 1
          fi
          digest="$(python3 - <<'PY'
          import json

          details = json.load(open("/tmp/data-chord-image.json"))["imageDetails"]
          if len(details) != 1 or not details[0].get("imageDigest"):
              raise SystemExit("ECR did not return exactly one immutable image digest")
          print(details[0]["imageDigest"])
          PY
          )"
          if ! aws ecr describe-image-scan-findings \
            --repository-name "${repository}" \
            --image-id "imageDigest=${digest}" \
            --output json > /tmp/data-chord-image-scan.json; then
            echo "::error::The published image has no completed ECR scan. Run the Publish or restore DataChord image workflow first."
            exit 1
          fi
          python3 - <<'PY'
          import json

          scan = json.load(open("/tmp/data-chord-image-scan.json"))
          status = scan.get("imageScanStatus", {}).get("status")
          if status != "COMPLETE":
              raise SystemExit(f"ECR scan is not complete: {status or 'UNKNOWN'}")
          counts = scan.get("imageScanFindings", {}).get("findingSeverityCounts", {})
          blocked = {level: int(counts.get(level, 0)) for level in ("CRITICAL", "HIGH")}
          if sum(blocked.values()):
              raise SystemExit(f"ECR scan blocks deployment: {blocked}")
          PY
          echo "image_digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "image_uri=${image_uri}@${digest}" >> "${GITHUB_OUTPUT}"

      - name: Require the completed VPC contract
        run: |
          python3 infra/scripts/cloud_one_environment.py validate \
            environments/cbiit/dev.json cbiit dev runtime \
            "${{ steps.image.outputs.image_digest }}"

      - name: Verify VPC and subnet ownership
        run: |
          set -euo pipefail
          config="environments/cbiit/dev.json"
          vpc_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["vpc_id"])' "${config}")"
          readarray -t subnet_ids < <(
            python3 -c 'import json,sys; print(*json.load(open(sys.argv[1]))["private_subnet_ids"], sep="\n")' "${config}"
          )
          test "$(aws ec2 describe-vpcs \
            --vpc-ids "${vpc_id}" \
            --query 'Vpcs[0].VpcId' --output text)" = "${vpc_id}"
          aws ec2 describe-subnets --subnet-ids "${subnet_ids[@]}" \
            --output json > /tmp/data-chord-subnets.json
          python3 - "${vpc_id}" "${#subnet_ids[@]}" <<'PY'
          import json
          import sys

          vpc_id = sys.argv[1]
          expected_count = int(sys.argv[2])
          subnets = json.load(open("/tmp/data-chord-subnets.json"))["Subnets"]
          if len(subnets) != expected_count:
              raise SystemExit("AWS did not return every configured subnet")
          if any(item["VpcId"] != vpc_id or item["State"] != "available" for item in subnets):
              raise SystemExit("every subnet must be available and belong to the configured VPC")
          if any(item["MapPublicIpOnLaunch"] for item in subnets):
              raise SystemExit("the internal dev preview requires private subnets")
          if len({item["AvailabilityZone"] for item in subnets}) < 2:
              raise SystemExit("private subnets must span at least two Availability Zones")
          PY

      - name: Create exact runtime plan
        id: plan
        run: |
          set -euo pipefail
          mkdir -p .plans
          python3 infra/scripts/cloud_one_environment.py tofu-vars \
            environments/cbiit/dev.json cbiit dev runtime \
            "${{ steps.image.outputs.image_digest }}" > .plans/dev.auto.tfvars.json
          tofu -chdir=infra/cloud-one init -input=false \
            -backend-config="bucket=${{ needs.preflight.outputs.state_bucket }}" \
            -backend-config="key=${{ needs.preflight.outputs.state_key }}" \
            -backend-config="region=${{ needs.preflight.outputs.region }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          tofu -chdir=infra/cloud-one plan -input=false -lock=false \
            -var-file="../../.plans/dev.auto.tfvars.json" \
            -out="../../.plans/dev-runtime.tfplan"
          tofu -chdir=infra/cloud-one show -no-color "../../.plans/dev-runtime.tfplan" \
            > .plans/dev-runtime.txt
          plan_sha256="$(sha256sum .plans/dev-runtime.tfplan | cut -d ' ' -f 1)"
          echo "plan_sha256=${plan_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Upload exact reviewed runtime plan
        id: upload-plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cbiit-dev-runtime-plan-${{ github.run_id }}
          path: |
            .plans/dev-runtime.tfplan
            .plans/dev-runtime.txt
            .plans/dev.auto.tfvars.json
            infra/cloud-one/.terraform.lock.hcl
          if-no-files-found: error
          retention-days: 14

      - name: Write release plan summary
        run: |
          {
            echo "## DataChord dev release plan"
            echo
            echo "- **Application source:** \`${{ needs.preflight.outputs.image_source_sha }}\`"
            echo "- **Deployment source:** \`${{ needs.preflight.outputs.infrastructure_source_sha }}\`"
            echo "- **Image:** \`${{ steps.image.outputs.image_uri }}\`"
            echo "- **AWS target:** \`${{ needs.preflight.outputs.account_id }}\` / \`${{ needs.preflight.outputs.region }}\`"
            echo "- **Plan SHA-256:** \`${{ steps.plan.outputs.plan_sha256 }}\`"
            echo "- **Operation:** ${{ inputs.operation }}"
          } >> "${GITHUB_STEP_SUMMARY}"

  apply:
    name: Apply reviewed cbiit/dev runtime plan
    if: ${{ inputs.operation == 'deploy' }}
    needs: [preflight, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.10.3

      - name: Download this run's reviewed runtime plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact_id }}
          path: .

      - name: Verify reviewed source and plan digest
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "${{ needs.plan.outputs.plan_sha256 }}  .plans/dev-runtime.tfplan" \
            | sha256sum --check --strict

      - name: Authenticate for approved dev deployment
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ needs.preflight.outputs.deployer_role_arn }}
          role-session-name: data-chord-dev-apply-${{ github.run_id }}
          role-duration-seconds: 3600
          aws-region: ${{ needs.preflight.outputs.region }}
          allowed-account-ids: ${{ needs.preflight.outputs.account_id }}

      - name: Apply the exact reviewed plan
        run: |
          tofu -chdir=infra/cloud-one init -input=false \
            -backend-config="bucket=${{ needs.preflight.outputs.state_bucket }}" \
            -backend-config="key=${{ needs.preflight.outputs.state_key }}" \
            -backend-config="region=${{ needs.preflight.outputs.region }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          tofu -chdir=infra/cloud-one apply -input=false "../../.plans/dev-runtime.tfplan"

      - name: Wait for the ECS service and internal target to stabilize
        run: |
          aws ecs wait services-stable --cluster data-chord-dev --services data-chord-dev
          running="$(aws ecs describe-services \
            --cluster data-chord-dev --services data-chord-dev \
            --query 'services[0].runningCount' --output text)"
          test "${running}" = "1"
          target_group="$(tofu -chdir=infra/cloud-one output -raw internal_dev_target_group_arn)"
          aws elbv2 wait target-in-service --target-group-arn "${target_group}"
          healthy="$(aws elbv2 describe-target-health \
            --target-group-arn "${target_group}" \
            --query 'length(TargetHealthDescriptions[?TargetHealth.State==`healthy`])' \
            --output text)"
          test "${healthy}" = "1"

      - name: Exercise the task role, data plane, and selected models
        run: |
          set -euo pipefail
          aws ecs describe-services \
            --cluster data-chord-dev --services data-chord-dev \
            --query 'services[0].networkConfiguration' --output json \
            > /tmp/data-chord-network.json
          task_arn="$(aws ecs run-task \
            --cluster data-chord-dev \
            --task-definition data-chord-dev \
            --launch-type FARGATE \
            --network-configuration file:///tmp/data-chord-network.json \
            --overrides '{"containerOverrides":[{"name":"app","command":["python","-m","scripts.cloud_one_smoke"]}]}' \
            --query 'tasks[0].taskArn' --output text)"
          test "${task_arn}" != "None"
          aws ecs wait tasks-stopped --cluster data-chord-dev --tasks "${task_arn}"
          aws ecs describe-tasks --cluster data-chord-dev --tasks "${task_arn}" \
            --output json > /tmp/data-chord-smoke-task.json
          python3 - <<'PY'
          import json

          task = json.load(open("/tmp/data-chord-smoke-task.json"))["tasks"][0]
          container = task["containers"][0]
          if container.get("exitCode") != 0:
              detail = container.get("reason") or task.get("stoppedReason") or "unknown failure"
              raise SystemExit(f"Cloud One smoke task failed: {detail}")
          PY

      - name: Write deployment summary
        if: always()
        run: |
          preview_url="$(tofu -chdir=infra/cloud-one output -raw internal_dev_preview_url 2>/dev/null || true)"
          {
            echo "## DataChord dev deployment"
            echo
            echo "- **Application source:** \`${{ needs.preflight.outputs.image_source_sha }}\`"
            echo "- **Deployment source:** \`${{ needs.preflight.outputs.infrastructure_source_sha }}\`"
            echo "- **Image:** \`${{ needs.plan.outputs.image_uri }}\`"
            echo "- **AWS target:** \`${{ needs.preflight.outputs.account_id }}\` / \`${{ needs.preflight.outputs.region }}\`"
            echo "- **ECS service:** \`data-chord-dev/data-chord-dev\`"
            echo "- **Reviewed plan SHA-256:** \`${{ needs.plan.outputs.plan_sha256 }}\`"
            echo "- **Verification result:** ${{ job.status }}"
            if [ -n "${preview_url}" ]; then
              echo "- **Internal dev preview:** ${preview_url}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
