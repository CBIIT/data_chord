name: Plan and deploy DataChord to Cloud One

run-name: DataChord ${{ inputs.operation }} (cbiit/${{ inputs.stage }})

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Create a read-only plan or deploy that exact plan through environment approval
        required: true
        default: plan
        type: choice
        options:
          - plan
          - deploy
      stage:
        description: Cloud One environment that receives the already-published image digest
        required: true
        default: dev
        type: choice
        options:
          - dev
          - qa
      image_source_sha:
        description: Optional full main-history commit SHA to deploy or roll back to (blank uses current main)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: data-chord-cbiit-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate ${{ inputs.stage }} release request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      account_id: ${{ steps.environment.outputs.account_id }}
      deployer_role_arn: ${{ steps.environment.outputs.deployer_role_arn }}
      region: ${{ steps.environment.outputs.region }}
      state_bucket: ${{ steps.environment.outputs.state_bucket }}
      state_key: ${{ steps.environment.outputs.state_key }}
      image_source_sha: ${{ steps.source.outputs.image_source_sha }}
      infrastructure_source_sha: ${{ steps.source.outputs.infrastructure_source_sha }}
      stage: ${{ steps.environment.outputs.stage }}
    steps:
      - name: Require main for every privileged run
        env:
          REQUESTED_REF: ${{ github.ref }}
        run: |
          test "${REQUESTED_REF}" = "refs/heads/main" || {
            echo "Cloud One releases must run from main." >&2
            exit 1
          }

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve reviewed application source
        id: source
        env:
          REQUESTED_IMAGE_SOURCE_SHA: ${{ inputs.image_source_sha }}
        run: |
          set -euo pipefail
          infrastructure_source_sha="$(git rev-parse HEAD)"
          test "${infrastructure_source_sha}" = "${GITHUB_SHA}"
          image_source_sha="$(python3 infra/scripts/resolve_release_source.py \
            --repository . \
            --current "${infrastructure_source_sha}" \
            --requested "${REQUESTED_IMAGE_SOURCE_SHA}")"
          {
            echo "image_source_sha=${image_source_sha}"
            echo "infrastructure_source_sha=${infrastructure_source_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Read the committed environment contract
        id: environment
        run: |
          stage="${{ inputs.stage }}"
          config="environments/cbiit/${stage}.json"
          python3 infra/scripts/cloud_one_environment.py validate "${config}" cbiit "${stage}"
          {
            echo "account_id=$(python3 infra/scripts/cloud_one_environment.py get "${config}" cbiit "${stage}" account_id)"
            echo "deployer_role_arn=arn:aws:iam::$(python3 infra/scripts/cloud_one_environment.py get "${config}" cbiit "${stage}" account_id):role/foundation/cbiit-datachord-deployer"
            echo "region=$(python3 infra/scripts/cloud_one_environment.py get "${config}" cbiit "${stage}" region)"
            echo "state_bucket=$(python3 infra/scripts/cloud_one_environment.py get "${config}" cbiit "${stage}" state_bucket_name)"
            echo "state_key=$(python3 infra/scripts/cloud_one_environment.py get "${config}" cbiit "${stage}" state_key)"
            echo "stage=${stage}"
          } >> "${GITHUB_OUTPUT}"

  plan:
    name: Plan cbiit/${{ needs.preflight.outputs.stage }} runtime
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_id: ${{ steps.upload-plan.outputs.artifact-id }}
      image_digest: ${{ steps.image.outputs.image_digest }}
      image_uri: ${{ steps.image.outputs.image_uri }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: tools/checkov/uv.lock

      - name: Install the locked Checkov tool
        run: |
          uv python install 3.13
          uv sync --project tools/checkov --frozen

      - name: Scan the reviewed infrastructure source
        run: bash scripts/check-iac-security.sh

      - name: Upload runtime Checkov evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cbiit-${{ needs.preflight.outputs.stage }}-runtime-checkov-${{ github.run_id }}
          path: .artifacts/checkov/
          if-no-files-found: warn
          retention-days: 14

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.10.3

      - name: Authenticate with read-only AWS permissions
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ needs.preflight.outputs.deployer_role_arn }}
          role-session-name: data-chord-${{ needs.preflight.outputs.stage }}-plan-${{ github.run_id }}
          aws-region: ${{ needs.preflight.outputs.region }}
          allowed-account-ids: ${{ needs.preflight.outputs.account_id }}
          managed-session-policies: arn:aws:iam::aws:policy/ReadOnlyAccess

      - name: Resolve the published and scanned application image
        id: image
        env:
          ACCOUNT_ID: ${{ needs.preflight.outputs.account_id }}
          AWS_REGION: ${{ needs.preflight.outputs.region }}
          IMAGE_SOURCE_SHA: ${{ needs.preflight.outputs.image_source_sha }}
        run: |
          set -euo pipefail
          repository="data-chord-dev"
          image_uri="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${repository}"
          aws ecr get-registry-scanning-configuration --output json \
            > /tmp/data-chord-registry-scan.json
          python3 infra/scripts/ecr_image.py registry /tmp/data-chord-registry-scan.json \
            --repository "${repository}"
          aws inspector2 list-coverage --max-results 1 --output json \
            > /tmp/data-chord-inspector-coverage.json
          python3 infra/scripts/ecr_image.py inspector \
            /tmp/data-chord-inspector-coverage.json
          if ! aws ecr describe-images \
            --repository-name "${repository}" \
            --image-ids "imageTag=${IMAGE_SOURCE_SHA}" \
            --output json > /tmp/data-chord-image.json; then
            echo "::error::No published image exists for ${IMAGE_SOURCE_SHA}. Run the Publish or restore DataChord image workflow first."
            exit 1
          fi
          digest="$(python3 infra/scripts/ecr_image.py digest /tmp/data-chord-image.json)"
          resource_id="arn:aws:ecr:${AWS_REGION}:${ACCOUNT_ID}:repository/${repository}/${digest}"
          coverage_filter="$(printf '{\"resourceId\":[{\"comparison\":\"EQUALS\",\"value\":\"%s\"}],\"resourceType\":[{\"comparison\":\"EQUALS\",\"value\":\"AWS_ECR_CONTAINER_IMAGE\"}]}' "${resource_id}")"
          aws inspector2 list-coverage \
            --filter-criteria "${coverage_filter}" \
            --output json > /tmp/data-chord-image-coverage.json
          if [ "$(python3 infra/scripts/ecr_image.py coverage \
            /tmp/data-chord-image-coverage.json --resource-id "${resource_id}")" != "complete" ]; then
            echo "::error::The published image has no completed Amazon Inspector scan. Run the Publish or restore DataChord image workflow first."
            exit 1
          fi
          findings_filter="$(printf '{\"ecrImageHash\":[{\"comparison\":\"EQUALS\",\"value\":\"%s\"}],\"ecrImageRegistry\":[{\"comparison\":\"EQUALS\",\"value\":\"%s\"}],\"ecrImageRepositoryName\":[{\"comparison\":\"EQUALS\",\"value\":\"%s\"}],\"findingStatus\":[{\"comparison\":\"EQUALS\",\"value\":\"ACTIVE\"}]}' "${digest}" "${ACCOUNT_ID}" "${repository}")"
          aws inspector2 list-findings \
            --filter-criteria "${findings_filter}" \
            --output json > /tmp/data-chord-image-findings.json
          python3 infra/scripts/ecr_image.py findings /tmp/data-chord-image-findings.json \
            --purpose deployment
          echo "image_digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "image_uri=${image_uri}@${digest}" >> "${GITHUB_OUTPUT}"

      - name: Require the completed VPC contract
        run: |
          stage="${{ needs.preflight.outputs.stage }}"
          python3 infra/scripts/cloud_one_environment.py validate \
            "environments/cbiit/${stage}.json" cbiit "${stage}" runtime \
            "${{ steps.image.outputs.image_digest }}"

      - name: Verify VPC and subnet ownership
        run: |
          set -euo pipefail
          stage="${{ needs.preflight.outputs.stage }}"
          config="environments/cbiit/${stage}.json"
          vpc_id="$(python3 infra/scripts/cloud_one_environment.py get "${config}" cbiit "${stage}" vpc_id)"
          readarray -t subnet_ids < <(
            python3 infra/scripts/cloud_one_environment.py get \
              "${config}" cbiit "${stage}" private_subnet_ids
          )
          test "$(aws ec2 describe-vpcs \
            --vpc-ids "${vpc_id}" \
            --query 'Vpcs[0].VpcId' --output text)" = "${vpc_id}"
          aws ec2 describe-subnets --subnet-ids "${subnet_ids[@]}" \
            --output json > /tmp/data-chord-subnets.json
          python3 infra/scripts/cloud_one_environment.py verify-subnets \
            "${config}" cbiit "${stage}" /tmp/data-chord-subnets.json

      - name: Create exact runtime plan
        id: plan
        run: |
          set -euo pipefail
          stage="${{ needs.preflight.outputs.stage }}"
          mkdir -p .plans
          python3 infra/scripts/cloud_one_environment.py tofu-vars \
            "environments/cbiit/${stage}.json" cbiit "${stage}" runtime \
            "${{ steps.image.outputs.image_digest }}" > ".plans/${stage}.auto.tfvars.json"
          tofu -chdir=infra/cloud-one init -input=false \
            -backend-config="bucket=${{ needs.preflight.outputs.state_bucket }}" \
            -backend-config="key=${{ needs.preflight.outputs.state_key }}" \
            -backend-config="region=${{ needs.preflight.outputs.region }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          tofu -chdir=infra/cloud-one plan -input=false -lock=false \
            -var-file="../../.plans/${stage}.auto.tfvars.json" \
            -out="../../.plans/${stage}-runtime.tfplan"
          tofu -chdir=infra/cloud-one show -no-color "../../.plans/${stage}-runtime.tfplan" \
            > ".plans/${stage}-runtime.txt"
          plan_sha256="$(sha256sum ".plans/${stage}-runtime.tfplan" | cut -d ' ' -f 1)"
          echo "plan_sha256=${plan_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Upload exact reviewed runtime plan
        id: upload-plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cbiit-${{ needs.preflight.outputs.stage }}-runtime-plan-${{ github.run_id }}
          path: |
            .plans/${{ needs.preflight.outputs.stage }}-runtime.tfplan
            .plans/${{ needs.preflight.outputs.stage }}-runtime.txt
            .plans/${{ needs.preflight.outputs.stage }}.auto.tfvars.json
            .artifacts/checkov/
            infra/cloud-one/.terraform.lock.hcl
          if-no-files-found: error
          retention-days: 14

      - name: Write release plan summary
        run: |
          {
            echo "## DataChord ${{ needs.preflight.outputs.stage }} release plan"
            echo
            echo "- **Application source:** \`${{ needs.preflight.outputs.image_source_sha }}\`"
            echo "- **Deployment source:** \`${{ needs.preflight.outputs.infrastructure_source_sha }}\`"
            echo "- **Image:** \`${{ steps.image.outputs.image_uri }}\`"
            echo "- **AWS target:** \`${{ needs.preflight.outputs.account_id }}\` / \`${{ needs.preflight.outputs.region }}\`"
            echo "- **Plan SHA-256:** \`${{ steps.plan.outputs.plan_sha256 }}\`"
            echo "- **Operation:** ${{ inputs.operation }}"
          } >> "${GITHUB_STEP_SUMMARY}"

  apply:
    name: Apply reviewed cbiit/${{ needs.preflight.outputs.stage }} runtime plan
    if: ${{ inputs.operation == 'deploy' }}
    needs: [preflight, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ needs.preflight.outputs.stage }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.10.3

      - name: Download this run's reviewed runtime plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact_id }}
          path: .

      - name: Verify reviewed source and plan digest
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "${{ needs.plan.outputs.plan_sha256 }}  .plans/${{ needs.preflight.outputs.stage }}-runtime.tfplan" \
            | sha256sum --check --strict

      - name: Authenticate for approved environment deployment
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ needs.preflight.outputs.deployer_role_arn }}
          role-session-name: data-chord-${{ needs.preflight.outputs.stage }}-apply-${{ github.run_id }}
          role-duration-seconds: 3600
          aws-region: ${{ needs.preflight.outputs.region }}
          allowed-account-ids: ${{ needs.preflight.outputs.account_id }}

      - name: Apply the exact reviewed plan
        run: |
          tofu -chdir=infra/cloud-one init -input=false \
            -backend-config="bucket=${{ needs.preflight.outputs.state_bucket }}" \
            -backend-config="key=${{ needs.preflight.outputs.state_key }}" \
            -backend-config="region=${{ needs.preflight.outputs.region }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          tofu -chdir=infra/cloud-one apply -input=false \
            "../../.plans/${{ needs.preflight.outputs.stage }}-runtime.tfplan"

      - name: Wait for the ECS service and internal target to stabilize
        run: |
          stage="${{ needs.preflight.outputs.stage }}"
          service="data-chord-${stage}"
          aws ecs wait services-stable --cluster "${service}" --services "${service}"
          running="$(aws ecs describe-services \
            --cluster "${service}" --services "${service}" \
            --query 'services[0].runningCount' --output text)"
          test "${running}" = "1"
          target_group="$(tofu -chdir=infra/cloud-one output -raw internal_dev_target_group_arn 2>/dev/null || true)"
          if [ -n "${target_group}" ]; then
            aws elbv2 wait target-in-service --target-group-arn "${target_group}"
            healthy="$(aws elbv2 describe-target-health \
              --target-group-arn "${target_group}" \
              --query 'length(TargetHealthDescriptions[?TargetHealth.State==`healthy`])' \
              --output text)"
            test "${healthy}" = "1"
          fi

      - name: Exercise the task role, data plane, and selected models
        run: |
          set -euo pipefail
          stage="${{ needs.preflight.outputs.stage }}"
          service="data-chord-${stage}"
          aws ecs describe-services \
            --cluster "${service}" --services "${service}" \
            --query 'services[0].networkConfiguration' --output json \
            > /tmp/data-chord-network.json
          task_arn="$(aws ecs run-task \
            --cluster "${service}" \
            --task-definition "${service}" \
            --launch-type FARGATE \
            --network-configuration file:///tmp/data-chord-network.json \
            --overrides '{"containerOverrides":[{"name":"app","command":["python","-m","scripts.cloud_one_smoke"]}]}' \
            --query 'tasks[0].taskArn' --output text)"
          test "${task_arn}" != "None"
          aws ecs wait tasks-stopped --cluster "${service}" --tasks "${task_arn}"
          aws ecs describe-tasks --cluster "${service}" --tasks "${task_arn}" \
            --output json > /tmp/data-chord-smoke-task.json
          python3 - <<'PY'
          import json

          task = json.load(open("/tmp/data-chord-smoke-task.json"))["tasks"][0]
          container = task["containers"][0]
          if container.get("exitCode") != 0:
              detail = container.get("reason") or task.get("stoppedReason") or "unknown failure"
              raise SystemExit(f"Cloud One smoke task failed: {detail}")
          PY

      - name: Write deployment summary
        if: always()
        run: |
          preview_url="$(tofu -chdir=infra/cloud-one output -raw internal_dev_preview_url 2>/dev/null || true)"
          {
            echo "## DataChord ${{ needs.preflight.outputs.stage }} deployment"
            echo
            echo "- **Application source:** \`${{ needs.preflight.outputs.image_source_sha }}\`"
            echo "- **Deployment source:** \`${{ needs.preflight.outputs.infrastructure_source_sha }}\`"
            echo "- **Image:** \`${{ needs.plan.outputs.image_uri }}\`"
            echo "- **AWS target:** \`${{ needs.preflight.outputs.account_id }}\` / \`${{ needs.preflight.outputs.region }}\`"
            echo "- **ECS service:** \`data-chord-${{ needs.preflight.outputs.stage }}/data-chord-${{ needs.preflight.outputs.stage }}\`"
            echo "- **Reviewed plan SHA-256:** \`${{ needs.plan.outputs.plan_sha256 }}\`"
            echo "- **Verification result:** ${{ job.status }}"
            if [ -n "${preview_url}" ]; then
              echo "- **Internal preview:** ${preview_url}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
